[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntc1"
version = "0.1.0"
description = "Neural Texture Compression — compact neural material textures"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22",
    "Pillow>=10.0.0",
    "tinycudann>=1.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
benchmark = []

[tool.setuptools.packages.find]
include = ["models*", "engine*"]
