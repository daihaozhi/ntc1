# Baseline: LearnableGridNetwork (PyTorch PE + PyTorch MLP + tcnn Grid)
# 4096 resolution, 4-bit quantization

model: learnable_grid
texture_resolution: 4096
grid_config: configs/grid/grid_4096.json

# Training
batch_size: 65536
crop_size: 256
crops_per_batch: 8
max_iter: 40000

# Optimizer
lr: 0.01
network_lr: 0.005
lr_patience: 1000
lr_factor: 0.7

# Model architecture
hidden_dim: 64
num_hidden_layers: 2
n_frequencies: 5
use_tiled_encoding: true
output_dim: 8
default_save_bits: 48
default_quantize_bits: 4

# LoD sampling
lod_sampling: exp               # uniform | exp | fixed0
mip_target_mode: discrete       # discrete | trilinear

# Regularization
boundary_continuity_weight: 0.0
boundary_band_width: 0.0
boundary_loss_preset: normal_roughness
transition_delta_weight: 0.0
transition_delta_band_width: 1.0

# Logging
eval_interval: 1000
save_interval: 5000

# Hardware
device: cuda
